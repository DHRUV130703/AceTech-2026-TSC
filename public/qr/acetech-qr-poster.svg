<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1748" width="1240" height="1748">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BBD7DC"/>
      <stop offset="1" stop-color="#EAF3F5"/>
    </linearGradient>
    <!-- SmartGRID motif -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="none" stroke="#A3CCDA" stroke-width="5"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade"><rect y="180" width="1240" height="420" fill="url(#gridFade)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1F2A4C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1240" height="1748" fill="url(#bg)"/>
  <rect y="180" width="1240" height="420" fill="url(#grid)" mask="url(#fade)" opacity="0.7"/>

  <!-- Header band. TODO(brand): replace wordmark text with official logo SVG. -->
  <rect width="1240" height="180" fill="#1F2A4C"/>
  <g transform="translate(390 50)">
